<!doctype html>
<html lang="en">
  <body>
    <div id="series" data-composition-id="series" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <style>
        #series .appicon {
          width: 72px;
          height: 72px;
          border-radius: 16px;
          margin-bottom: 26px;
          box-shadow: 0 12px 30px rgba(110, 90, 170, 0.3);
        }
        #series .tile {
          position: absolute;
          width: 560px;
          border-radius: 16px;
          overflow: hidden;
          background: #fff;
          box-shadow:
            0 2px 6px rgba(26, 25, 23, 0.06),
            0 24px 60px rgba(26, 25, 23, 0.16);
        }
        #series .tile img {
          display: block;
          width: 100%;
          height: 330px;
          object-fit: cover;
          object-position: top;
        }
        #series .tile span {
          position: absolute;
          left: 18px;
          bottom: 16px;
          padding: 8px 14px;
          border-radius: 999px;
          background: rgba(250, 247, 235, 0.92);
          font: 600 20px/1 ui-monospace, "SF Mono", monospace;
          color: #963c5a;
        }
        #series .tile.dark {
          background: #1a1917;
        }
        #series .tile.dark img {
          object-fit: contain;
          object-position: center;
        }
        #t-profile { left: 980px; top: 90px; filter: blur(3px); }
        #t-memos { left: 1300px; top: 160px; filter: blur(1.5px); }
        #t-moment { left: 1040px; top: 420px; }
        #t-knowledge { left: 1330px; top: 560px; }
        #t-workspace { left: 1000px; top: 690px; }
      </style>
      <!-- signed-out public pages (assets/sites, captured 2026-11-03) -->
      <div class="tile" id="t-profile"><img src="assets/sites/profile.png" alt="" /><span>you-find.me</span></div>
      <div class="tile" id="t-memos"><img src="assets/sites/memos.png" alt="" /><span>memos</span></div>
      <div class="tile" id="t-moment"><img src="assets/sites/moment.png" alt="" /><span>moment</span></div>
      <div class="tile" id="t-knowledge"><img src="assets/sites/knowledge.png" alt="" /><span>knowledge</span></div>
      <div class="tile dark" id="t-workspace"><img src="assets/sites/workspace.png" alt="" /><span>my-workspace</span></div>
      <div class="col">
        <div class="appicon"><img src="assets/app-icon.png" alt="" /></div>
        <div class="kicker">PART OF THE VESPER SERIES</div>
        <div class="title">One console,<br />every surface.</div>
        <div class="sub">The same notes, photos and writing on the web and the desktop.</div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const rise = { opacity: 0, y: 24 };
        const show = { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" };
        tl.fromTo("#series .col > *", rise, { ...show, stagger: 0.12 }, 0.05);
        tl.fromTo("#series .tile", { opacity: 0, y: 80, rotation: 0 }, { opacity: 1, y: 0, rotation: (i) => [-4, 3, -2, 4, -1][i], duration: 0.8, ease: "power3.out", stagger: 0.28 }, 0.2);
        tl.to("#series .tile", { y: -24, duration: 5, ease: "none" }, 1);
        tl.to(["#series .tile", "#series .col"], { opacity: 0, duration: 0.35 }, 5.65);
        window.__timelines["series"] = tl;
      </script>
    </div>
  </body>
</html>
