<!doctype html>
<html lang="en">
  <body>
    <div id="opening" data-composition-id="opening" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
      <style>
        #opening .lockup {
          display: flex;
          align-items: center;
          gap: 34px;
        }
        #opening .hairline {
          width: 160px;
          height: 4px;
          border-radius: 2px;
          background: #963c5a;
        }
        #opening .halo {
          position: absolute;
          right: -0.07em;
          top: 0.01em;
          width: 0.4em;
          height: 0.4em;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(216, 160, 178, 0.9), rgba(216, 160, 178, 0) 65%);
        }
      </style>
      <div class="center">
        <div class="lockup">
          <div class="appicon"><img src="assets/app-icon.png" alt="" /></div>
          <div class="mark">
            <span class="letters"><span>V</span><span>e</span><span>s</span><span>p</span><span>e</span><span>r</span></span>
            <svg class="star" viewBox="-1 -1 2 2"><path d="M0-1C.08-.08.08-.08 1 0 .08.08.08.08 0 1-.08.08-.08.08-1 0-.08-.08-.08-.08 0-1Z" /></svg>
            <span class="halo"></span>
          </div>
        </div>
        <span class="hairline"></span>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        // how far the icon sits from the centre of the finished lockup
        const box = document.querySelector("#opening .lockup").getBoundingClientRect();
        const icon = document.querySelector("#opening .appicon").getBoundingClientRect();
        const shift = box.left + box.width / 2 - (icon.left + icon.width / 2);
        tl.fromTo("#opening .appicon", { opacity: 0, x: shift, scale: 0.6 }, { opacity: 1, scale: 1.15, duration: 0.7, ease: "back.out(1.5)" }, 0.1);
        tl.to("#opening .appicon", { x: 0, scale: 1, duration: 0.9, ease: "power3.inOut" }, 0.9);
        tl.fromTo("#opening .letters span", { opacity: 0, y: 70, skewX: -8 }, { opacity: 1, y: 0, skewX: 0, duration: 0.9, ease: "power3.out", stagger: 0.07 }, 1.15);
        tl.fromTo("#opening .star", { opacity: 0, x: -520, y: 220, rotation: -180, scale: 0.3 }, { opacity: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 1.2, ease: "power2.inOut" }, 1.35);
        tl.fromTo("#opening .halo", { opacity: 0, scale: 0.2 }, { opacity: 0.9, scale: 1, duration: 0.3, ease: "power2.out" }, 2.55);
        tl.to("#opening .halo", { opacity: 0, scale: 1.8, duration: 0.7, ease: "power2.in" }, 2.85);
        tl.to("#opening .star", { scale: 1.3, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 2.58);
        tl.fromTo("#opening .hairline", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.9, ease: "sine.inOut" }, 1.9);
        tl.to("#opening .center", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, 3.15);
        window.__timelines["opening"] = tl;
      </script>
    </div>
  </body>
</html>
