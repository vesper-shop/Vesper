<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* SPEC.md · Look: what more than one scene uses; each composition keeps its own styles */
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        src: url("assets/fonts/InstrumentSerif-Italic.ttf") format("truetype");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #faf7eb;
        font-family: -apple-system, "SF Pro Display", sans-serif;
        color: #1a1917;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }

      .mark {
        position: relative;
        font: italic 400 300px/1 "Instrument Serif", serif;
        letter-spacing: -0.01em;
        padding: 0 40px;
      }
      .mark.small {
        font-size: 210px;
      }
      .letters span {
        display: inline-block;
        background: linear-gradient(100deg, #1a1917 0%, #1a1917 45%, #963c5a 100%);
        background-size: 600% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        /* italic glyphs lean past their advance; pad the clip box and pull the spacing back */
        padding: 0.06em 0.14em 0.12em;
        margin: -0.06em -0.1em -0.12em;
      }
      .letters span:nth-child(1) { background-position: 0% 0; }
      .letters span:nth-child(2) { background-position: 20% 0; }
      .letters span:nth-child(3) { background-position: 40% 0; }
      .letters span:nth-child(4) { background-position: 60% 0; }
      .letters span:nth-child(5) { background-position: 80% 0; }
      .letters span:nth-child(6) { background-position: 100% 0; }
      .star {
        position: absolute;
        right: 0;
        top: 0.08em;
        width: 0.26em;
        height: 0.26em;
        fill: #963c5a;
      }
      .appicon {
        width: 168px;
        height: 168px;
        flex: none;
        border-radius: 38px;
        overflow: hidden;
        box-shadow:
          0 2px 6px rgba(26, 25, 23, 0.08),
          0 24px 60px rgba(110, 90, 170, 0.35);
      }
      .appicon img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .col {
        position: absolute;
        left: 140px;
        top: 0;
        bottom: 0;
        width: 860px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .kicker {
        font: 600 22px/1 ui-monospace, "SF Mono", monospace;
        letter-spacing: 0.24em;
        color: #963c5a;
        margin-bottom: 28px;
      }
      .title {
        font-size: 96px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.04;
      }
      .sub {
        margin-top: 24px;
        width: 760px;
        font-size: 36px;
        line-height: 1.35;
        color: #6b6760;
      }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <audio id="soundtrack" class="clip" src="assets/audio/soundtrack.m4a" data-start="0" data-duration="40" data-volume="1" data-track-index="0"></audio>
      <div id="s-opening" class="clip" data-composition-id="opening" data-composition-src="compositions/opening.html" data-start="0" data-duration="3.5" data-track-index="1"></div>
      <div id="s-app" class="clip" data-composition-id="app" data-composition-src="compositions/app.html" data-start="3.5" data-duration="23.5" data-track-index="1"></div>
      <div id="s-series" class="clip" data-composition-id="series" data-composition-src="compositions/series.html" data-start="27" data-duration="6" data-track-index="1"></div>
      <div id="s-end" class="clip" data-composition-id="end" data-composition-src="compositions/end.html" data-start="33" data-duration="7" data-track-index="1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
